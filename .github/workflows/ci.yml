name: ci

on:
  push:
    branches: [main, devv]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q paicode
      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pytest -q
          else
            python -m pytest -q tests/test_settings.py tests/test_mcp.py tests/test_hooks_plugins.py tests/test_checkpoints.py tests/test_governance.py tests/test_server.py tests/test_diagnostics.py tests/test_bench.py
          fi

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paicode-dist
          path: dist/
