[metadata]
name = pai-code
version = 0.13.0
description = A terminal coding agent with a multi-pane TUI and OpenAI-compatible providers.
long_description = file: README.md
long_description_content_type = text/markdown
author = gtkrshnaaa
author_email = gtkrshnaaa@gmail.com
license = MIT
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.10
install_requires =
    openai==3.57.0
    textual==8.2.8
    rich==15.0.0
    Pygments==2.21.0
include_package_data = True

[options.packages.find]
where = .
exclude =
    tests
    tests.*

[options.entry_points]
console_scripts =
    pai = paicode.cli:main
